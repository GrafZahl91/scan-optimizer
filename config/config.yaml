log_level: INFO

watch_folder: /scans

convert:
  dpi: 200

cleanup:
  gaussian_blur: 3
  median_blur: 3

deskew:
  enabled: true
  min_angle: 2
  max_angle: 10

crop:
  enabled: true

  # Rand um die erkannte Box
  margin: 10

  # Verarbeitung auf verkleinertem Bild
  preview_scale: 0.25

  # Adaptive Threshold
  threshold_blocksize: 51
  threshold_c: 15

  # Morphologie
  close_kernel: 15
  dilate_horizontal: 45
  dilate_vertical: 25
  open_kernel: 3

  # Mindestgröße einer Kontur
  min_area: 300

blank_page:
  enabled: true
  dry_run: false
  border: 40
  min_contour: 100
  min_area: 500000
