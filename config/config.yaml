log_level: INFO

watch_folder: /scans

convert:
  dpi: 200

cleanup:
  gaussian_blur: 3
  median_blur: 3

deskew:
  enabled: true
  min_angle: 2
  max_angle: 10

crop:
  enabled: true
  margin: 10

blank_page:
  enabled: true
  dry_run: false
  border: 40
  min_contour: 100
  min_coverage: 0.003

enhance:
  enabled: true
  autocontrast: true

  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid_size: 8

pdf:
  jpeg_quality: 80

ocr:
  enabled: true
  adaptive_threshold: false
  denoise: true
  sharpen: true

ocr:
  enabled: false
  denoise: true
  adaptive_threshold: false
  sharpen: true
