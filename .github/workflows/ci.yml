name: CI

on:
  push:
    branches:
      - develop
      - main
      - feature/**
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff opencv-python-headless PyMuPDF pyyaml pikepdf

      - name: Compile Python
        run: |
          python -m compileall src

      - name: Ruff
        run: |
          ruff check src
